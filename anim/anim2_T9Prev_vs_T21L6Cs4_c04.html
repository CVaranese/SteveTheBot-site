  });
  return {settings: {replayFormatVersion: '3.9.0.0', startTimestamp: '2026-11-12T00:00:00Z', isTeams: false,
      stageId: 32, isPal: false, isFrozenStadium: false, platform: 'dolphin', consoleNickname: 'simulator',
      timerType: 'counting down', characterUiPlacesCount: 2, gameType: 'stock', friendlyFireOn: false,
      isBreakTheTargetsOrTitleDemo: false, isClassicOrAdventureMode: false, isHomeRunContestOrEventMatch: false,
      isSingleButtonMode: false, timerCountsDuringPause: false, bombRain: false, itemSpawnRate: 'off',
      selfDestructScoreValue: -1, timerStart: 480, damageRatio: 1,
      playerSettings: [playerSetting(0, 'model'), playerSetting(1, 'opponent')]},
    frames, ending: {gameEndMethod: 'GAME!', quitInitiator: -1}};
}
const SC = D.scenarios || ['edgeguard', 'recovery', 'follow-up'];
const viewer = document.querySelector('slippi-viewer');
const tabs = document.getElementById('tabs'), picks = document.getElementById('picks');
const status = document.getElementById('status');
document.getElementById('title').textContent = D.model + ' in the scenario starts';
document.getElementById('sub').textContent = 'Opponent: ' + D.opponent + '. Captain Falcon against Captain Falcon, Final Destination.';
function btn(parent, label, on){ const b = document.createElement('button'); b.textContent = label;
  b.addEventListener('click', on); parent.appendChild(b); return b; }
async function choose(s, k){
  const list = D.samples.filter(x => x.scenario === s);
  picks.replaceChildren();
  list.forEach((x, i) => { const b = btn(picks, 'sample ' + (i + 1), () => choose(s, i));
    b.className = x.ok ? 'ok' : 'no'; b.setAttribute('aria-pressed', i === k); });
  for(const b of tabs.children) b.setAttribute('aria-pressed', b.dataset.s === s);
  const cur = list[k], r = document.getElementById('result');
  r.textContent = 'Result: ' + cur.result; r.className = 'result ' + (cur.ok ? 'ok' : 'no');
  status.textContent = 'Loading...';
  try {
    const trace = await (await fetch(cur.file)).json();
    const data = toReplay(trace);
    viewer.setReplayData(data);
    status.textContent = data.frames.length + ' frames. Saved from a game of ' + cur.from + '.';
  } catch (e) { console.error(e); status.textContent = 'Could not load the trace: ' + e.message; }
}
SC.forEach(s => { btn(tabs, s, () => choose(s, 0)).dataset.s = s; });
customElements.whenDefined('slippi-viewer').then(() => choose(SC[0], 0));
</script>
